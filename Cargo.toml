[workspace]
resolver = "3"
members = [
    "crates/*",
    "crates/engine/dylib",
    "programs/editor",
    "game",
    "game/scripts",
    "game/scripts/dll",
]
# The static build: the engine crates, the game, and its script crate. The editor
# program, the engine DLL, and the script DLL build only when named, with
# `--profile dynamic` (`editor.bat` has the command).
default-members = ["crates/*", "game", "game/scripts"]

[workspace.package]
version = "0.1.0"
edition = "2024"

# All versions live here; crates use `name.workspace = true`.
[workspace.dependencies]
# Dependency rule: core -> platform -> assets -> scene -> events -> audio -> gameplay -> gpu
# -> render -> ui -> devtools -> editor -> engine -> game.
# A crate may depend only on crates to its left.
# The derive macros of `maki-core`. Not in the rule above: it is code of the build.
maki-macros = { path = "crates/macros" }
maki-core = { path = "crates/core" }
maki-platform = { path = "crates/platform" }
maki-assets = { path = "crates/assets" }
maki-scene = { path = "crates/scene" }
maki-events = { path = "crates/events" }
maki-audio = { path = "crates/audio" }
maki-gameplay = { path = "crates/gameplay" }
maki-gpu = { path = "crates/gpu" }
maki-render = { path = "crates/render" }
maki-ui = { path = "crates/ui" }
maki-devtools = { path = "crates/devtools" }
maki-editor = { path = "crates/editor" }
maki-engine = { path = "crates/engine" }
maki-engine-dylib = { path = "crates/engine/dylib" }

anyhow = "1.0.104"
ash = "0.38.0"
ash-window = "0.13.0"
gpu-allocator = { version = "0.28.0", default-features = false, features = ["std", "vulkan"] }
# Same version as winit: the gpu crate makes its surface from winit's handles.
raw-window-handle = { version = "0.6.2", features = ["std"] }
slotmap = "1.1.1"
# Loads the script DLL of a project into the editor. `ash` has it already: the same
# version.
libloading = "0.8.9"
# Vectors, matrices, quaternions.
glam = "0.34.1"
# `import` reads the buffers of a file. It also brings the `image` crate, for textures later.
# The two extensions describe glass: how much light goes through, and how much it bends.
gltf = { version = "1.4.1", features = ["KHR_materials_transmission", "KHR_materials_ior", "KHR_lights_punctual"] }
# Decodes texture files. The gltf crate has it too: the same version, no second copy.
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
# No reflection and no thread pool: schedules run on the calling thread.
# `debug` puts system names in schedule error messages.
bevy_ecs = { version = "0.20.0", default-features = false, features = ["std", "debug"] }
serde = { version = "1.0.229", features = ["derive"] }
# The format of the room files: Rust syntax for data, with line numbers in its errors.
ron = "0.12.2"
toml = "1.1.8"
# The tree of values of a thing with fields (`maki_core::fields`): what the inspector
# changes. The gltf crate has it too: the same version, no second copy.
serde_json = "1.0.153"
# For the derive macros of the engine (`crates/macros`). The macros of serde and of
# bevy_ecs have them too.
syn = { version = "2.0.119", features = ["full"] }
quote = "1.0.47"
proc-macro2 = "1.0.107"
# The event commands are enums of types that the events crate does not know: this
# calls their serde code through a trait object.
erased-serde = "0.4.10"
# Windows on Linux need the default x11/wayland features, so defaults stay on.
winit = "0.30.12"
# No default fonts means no text, so that feature stays on.
egui = { version = "0.36.2", default-features = false, features = ["default_fonts"] }
# No clipboard and no link opening: the debug panels do not need them.
egui-winit = { version = "0.36.2", default-features = false }
# The docks of a tool (the editor): tabs that are moved, split, and grouped. `serde`:
# the layout is saved.
egui_dock = { version = "0.21.1", features = ["serde"] }
# Sound output and mixing. Only the audio crate uses it. Files: WAV and Ogg Vorbis.
kira = { version = "0.12.5", default-features = false, features = ["cpal", "wav", "pcm", "ogg", "vorbis"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tracing-tracy = "0.12.0"

# The build of the editor: the engine crates are one DLL, and the script crate of a
# project is a DLL that the editor loads. A DLL of Windows exports 65535 symbols at
# most. A crate at `opt-level` 0 or 1 exports each generic function
# that it made, and the engine DLL then has too many: the crates of others are
# built at 2.
[profile.dynamic]
inherits = "dev"

[profile.dynamic.package."*"]
opt-level = 2

# The engine crates at 2 too: `"*"` names only the crates of others. The count of the
# engine DLL: `python tools/symbol_count.py`.
[profile.dynamic.package.maki-core]
opt-level = 2
[profile.dynamic.package.maki-platform]
opt-level = 2
[profile.dynamic.package.maki-assets]
opt-level = 2
[profile.dynamic.package.maki-scene]
opt-level = 2
[profile.dynamic.package.maki-events]
opt-level = 2
[profile.dynamic.package.maki-audio]
opt-level = 2
[profile.dynamic.package.maki-gameplay]
opt-level = 2
[profile.dynamic.package.maki-gpu]
opt-level = 2
[profile.dynamic.package.maki-render]
opt-level = 2
[profile.dynamic.package.maki-ui]
opt-level = 2
[profile.dynamic.package.maki-devtools]
opt-level = 2
[profile.dynamic.package.maki-editor]
opt-level = 2
[profile.dynamic.package.maki-engine]
opt-level = 2
[profile.dynamic.package.maki-engine-dylib]
opt-level = 2
