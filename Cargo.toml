[workspace]
resolver = "3"
members = ["crates/*", "game"]

[workspace.package]
version = "0.1.0"
edition = "2024"

# All versions live here; crates use `name.workspace = true`.
[workspace.dependencies]
# Dependency rule: core -> platform -> assets -> gpu -> render -> ui -> game.
# A crate may depend only on crates to its left.
maki-core = { path = "crates/core" }
maki-platform = { path = "crates/platform" }
maki-assets = { path = "crates/assets" }
maki-gpu = { path = "crates/gpu" }
maki-render = { path = "crates/render" }
maki-ui = { path = "crates/ui" }

anyhow = "1.0.104"
ash = "0.38.0"
ash-window = "0.13.0"
gpu-allocator = { version = "0.28.0", default-features = false, features = ["std", "vulkan"] }
# Same version as winit: the gpu crate makes its surface from winit's handles.
raw-window-handle = { version = "0.6.2", features = ["std"] }
slotmap = "1.1.1"
# Vectors, matrices, quaternions.
glam = "0.34.1"
# `import` reads the buffers of a file. It also brings the `image` crate, for textures later.
gltf = "1.4.1"
# No reflection and no thread pool: schedules run on the calling thread.
# `debug` puts system names in schedule error messages.
bevy_ecs = { version = "0.20.0", default-features = false, features = ["std", "debug"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.8"
# Windows on Linux need the default x11/wayland features, so defaults stay on.
winit = "0.30.12"
# No default fonts means no text, so that feature stays on.
egui = { version = "0.36.2", default-features = false, features = ["default_fonts"] }
# No clipboard and no link opening: the debug panels do not need them.
egui-winit = { version = "0.36.2", default-features = false }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tracing-tracy = "0.12.0"
