# The project file: what the engine must know of this game. A path starts at this
# folder.
name = "maki"
# The room files: where the editor opens and saves.
rooms = "assets/rooms"
# Where the game starts if the config file names no room: a file of `rooms`, and a
# spawn point of it.
start_room = "room_a.ron"
# The spawn point "start".
start_spawn = 11
save = "save.ron"
# The prefab file of the player, from `rooms`.
player = { path = "prefabs/player.prefab", id = "86520338f7517f25" }
# The cargo package that the editor builds and loads: the script crate as a DLL.
scripts = "maki-game-dll"

# The menus of the screens, from `rooms`. The game starts in play (`[rules] start`
# of the config): the title shows after "Quit to title".
[screens]
title = "data/menus/title.menu.ron"
pause = "data/menus/pause.menu.ron"
game_over = "data/menus/game_over.menu.ron"
