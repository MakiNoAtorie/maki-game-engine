[package]
name = "maki-game"
version.workspace = true
edition.workspace = true

# The program of the game: the engine and the script crate of the project, linked
# statically. No editor, no DLL.
[features]
# Sends tracing spans to the Tracy profiler.
profile = ["maki-engine/profile"]

[dependencies]
maki-engine.workspace = true
maki-game-scripts = { path = "scripts" }
