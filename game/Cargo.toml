[package]
name = "maki-game"
version.workspace = true
edition.workspace = true

[features]
# Sends tracing spans to the Tracy profiler.
profile = ["dep:tracing-tracy"]
# The room editor: `maki-game --editor`. A build without it has no editor code.
editor = ["dep:maki-editor"]
# Spike of part 6: the engine is a DLL, and the code of `shake.rs` comes from the
# script DLL (`spike/scripts`). Build with `--profile dynamic`.
dynamic = ["dep:maki-engine"]

[dependencies]
maki-core.workspace = true
maki-platform.workspace = true
maki-assets.workspace = true
maki-scene.workspace = true
maki-events.workspace = true
maki-audio.workspace = true
maki-gameplay.workspace = true
maki-render.workspace = true
maki-ui.workspace = true
maki-devtools.workspace = true
maki-editor = { workspace = true, optional = true }
maki-engine = { workspace = true, optional = true }
anyhow.workspace = true
bevy_ecs.workspace = true
glam.workspace = true
serde.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-tracy = { workspace = true, optional = true }
