[package]
name = "maki-engine-dylib"
version.workspace = true
edition.workspace = true

# All engine crates as one shared library. The editor program and the script DLL of
# a project link to it, so they have one copy of each engine crate, of `bevy_ecs`, and
# of the standard library. Built only with `--profile dynamic`: in the dev profile a
# DLL of this size has more symbols than Windows permits.
[lib]
crate-type = ["dylib"]
test = false
doctest = false

[dependencies]
maki-core.workspace = true
maki-platform.workspace = true
maki-assets.workspace = true
maki-scene.workspace = true
maki-physics.workspace = true
maki-events.workspace = true
maki-audio.workspace = true
maki-gameplay.workspace = true
maki-gpu.workspace = true
maki-render.workspace = true
maki-ui.workspace = true
maki-devtools.workspace = true
maki-editor.workspace = true
